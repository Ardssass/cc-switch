name: Release

on:
  push:
    tags:
      - 'v*'
  # 手动触发即干跑：完整编译，产物只留在 workflow 里，不建 GitHub Release
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # 带上事件名：手动干跑也能选 tag，和正式发布同组会把正在跑的发布取消掉
  group: release-${{ github.event_name }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  # 应用内更新摘要（src/whats-new/<版本>.json，见同目录 README）随安装包发出。漏写的话
  # 升级到这一版的用户什么也看不到；结构写坏的话弹窗渲染出错，整个应用落进错误页。
  # 放在最前面查，不白跑编译。推 tag 和 push main 同时发生，不能指望 CI 先跑完单测，
  # 所以这里自己跑一遍检查所有随包摘要的那份单测。
  whats-new-check:
    name: Check in-app what's new summaries
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # 手动干跑可以在任意分支上跑，那时这一版的摘要可能还没写，只在推 tag 时要求存在
      - name: Require this version's summary
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          file="src/whats-new/${TAG#v}.json"
          if [ ! -f "$file" ]; then
            echo "::error file=$file::Missing $file. Write the in-app summary for $TAG (see src/whats-new/README.md); use \"items\": [] to skip the popup."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Setup pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          corepack install
          pnpm --version

      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Validate all summaries
        run: pnpm vitest run tests/config/whatsNewEntries.test.ts

  # 只出 Windows x86_64（msi + 便携版 zip）。没有更新签名密钥，所以构建时用 --config
  # 关掉 createUpdaterArtifacts：tauri.conf.json 里它是 true，开着而缺密钥会直接失败。
  # 代价是产物不带 .sig，应用内自动更新不可用；恢复签名时把密钥步骤加回来并去掉这层覆盖。
  release:
    needs: whats-new-check
    runs-on: windows-2022
    environment: release

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      # rust-toolchain.toml 是编译器版本的唯一来源：直接装它，免得先装 stable 再被 rustup 换掉
      - name: Read pinned Rust toolchain
        id: rust-toolchain
        shell: bash
        run: |
          channel=$(sed -nE 's/^channel *= *"([^"]+)".*/\1/p' rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}

      - name: Setup pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          corepack install
          node --version
          pnpm --version

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build Tauri App (Windows)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $configPath = Join-Path $env:RUNNER_TEMP 'no-updater-artifacts.conf.json'
          '{ "bundle": { "createUpdaterArtifacts": false } }' |
            Set-Content -Path $configPath -Encoding utf8
          # 只发布 MSI（和便携版 exe），不打用不上的 NSIS 安装包
          pnpm tauri build --bundles msi --config $configPath

      - name: Prepare Windows Assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          # e.g., v3.5.0；手动干跑时是分支名，斜杠会被当成目录，换成 -
          $VERSION = $env:GITHUB_REF_NAME -replace '/', '-'
          $targetRoot = 'src-tauri/target/release'

          $msi = Get-ChildItem -Path (Join-Path $targetRoot 'bundle/msi') -Recurse -Include *.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $msi) {
            # 兜底：全局搜索 .msi
            $msi = Get-ChildItem -Path (Join-Path $targetRoot 'bundle') -Recurse -Include *.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if ($null -eq $msi) {
            throw 'No Windows MSI installer found'
          }

          # #8534：旧版本的应用内更新器以 `msiexec /passive /promptrestart` 安装、不带任何 REBOOT
          # 选项，文件被占用时会不经提示直接重启系统，所以 MSI 自身必须带 REBOOT=ReallySuppress。
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $db = $installer.GetType().InvokeMember('OpenDatabase', 'InvokeMethod', $null, $installer, @($msi.FullName, 0))
          $view = $db.GetType().InvokeMember('OpenView', 'InvokeMethod', $null, $db, @('SELECT `Value` FROM `Property` WHERE `Property`=''REBOOT'''))
          $view.GetType().InvokeMember('Execute', 'InvokeMethod', $null, $view, $null) | Out-Null
          $record = $view.GetType().InvokeMember('Fetch', 'InvokeMethod', $null, $view, $null)
          $reboot = if ($null -ne $record) { $record.GetType().InvokeMember('StringData', 'GetProperty', $null, $record, 1) } else { $null }
          $view.GetType().InvokeMember('Close', 'InvokeMethod', $null, $view, $null) | Out-Null
          if ($reboot -ne 'ReallySuppress') {
            throw "MSI Property table must set REBOOT=ReallySuppress (found: '$reboot') - see #8534"
          }
          Write-Host "MSI REBOOT property: $reboot"

          $dest = "CC-Switch-$VERSION-Windows.msi"
          Copy-Item $msi.FullName (Join-Path release-assets $dest)
          Write-Host "Installer copied: $dest"

          $sigPath = "$($msi.FullName).sig"
          if (Test-Path $sigPath) {
            Copy-Item $sigPath (Join-Path release-assets ("$dest.sig"))
            Write-Host "Signature copied: $dest.sig"
          } else {
            Write-Warning "No updater signature for $($msi.Name); shipping unsigned (in-app updates unavailable)"
          }

          # 绿色版（portable）：仅可执行文件打 zip（不参与 Updater）
          $exeCandidates = @(
            'src-tauri/target/release/cc-switch.exe',
            'src-tauri/target/x86_64-pc-windows-msvc/release/cc-switch.exe'
          )
          $exePath = $exeCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($null -ne $exePath) {
            $portableDir = 'release-assets/CC-Switch-Portable'
            New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
            Copy-Item $exePath $portableDir
            @('# CC Switch portable build marker', 'portable=true') |
              Set-Content -Path (Join-Path $portableDir 'portable.ini') -Encoding UTF8
            $portableZip = "release-assets/CC-Switch-$VERSION-Windows-Portable.zip"
            Compress-Archive -Path "$portableDir/*" -DestinationPath $portableZip -Force
            Remove-Item -Recurse -Force $portableDir
            Write-Host "Windows portable zip created: CC-Switch-$VERSION-Windows-Portable.zip"
          } else {
            throw 'Portable exe not found'
          }

      - name: List prepared assets
        shell: bash
        run: |
          ls -la release-assets || true

      - name: Upload release artifacts to workflow
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-windows
          path: release-assets/*
          if-no-files-found: error

      - name: List generated bundles (debug)
        if: always()
        shell: bash
        run: |
          echo "Listing bundles in src-tauri/target..."
          find src-tauri/target -maxdepth 4 -type f -name "*.*" 2>/dev/null || true
